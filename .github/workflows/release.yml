name: Release

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            archive: x86_64-linux

          - runner: ubuntu-24.04-arm
            archive: aarch64-linux

          - runner: macos-15-intel
            archive: x86_64-macos

          - runner: macos-latest
            archive: aarch64-macos

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev \
            portaudio19-dev \
            libflac-dev \
            libvorbis-dev \
            libfaad-dev \
            libmpg123-dev \
            libmad0-dev \
            libopusfile-dev \
            libsoxr-dev \
            libavcodec-dev \
            libavformat-dev \
            libpulse-dev \
            libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            portaudio \
            flac \
            libvorbis \
            faad2 \
            mpg123 \
            mad \
            opusfile \
            libsoxr \
            ffmpeg \
            openssl

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            zig build \
              -Doptimize=ReleaseSafe \
              -Dhomebrew-prefix="$(brew --prefix)"
          else
            zig build \
              -Doptimize=ReleaseSafe
          fi

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - zig-out/bin/squeezelite

      - name: Archive
        run: |
          chmod a+x zig-out/bin/squeezelite
          tar -czf squeezelite-${{ github.ref_name }}-${{ matrix.archive }}.tar.gz -C zig-out/bin squeezelite

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: squeezelite-${{ github.ref_name }}-${{ matrix.archive }}.tar.gz
